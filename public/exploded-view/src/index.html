<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>A-Frame: Tap to Place Turbine</title>
  <meta itemprop="name" content="A-Frame: Tap to Place Turbine">
  <meta name="twitter:title" content="A-Frame: Tap to Place Turbine">
  <meta property="og:title" content="A-Frame: Tap to Place Turbine">
  <meta property="og:site_name" content="A-Frame: Tap to Place Turbine">
  <meta name="description"
    content="This example allows the user to place a turbofan engine by tapping or clicking the ground.">
  <meta itemprop="description"
    content="This example allows the user to place a turbofan engine by tapping or clicking the ground.">
  <meta property="og:description"
    content="This example allows the user to place a turbofan engine by tapping or clicking the ground.">
  <meta name="twitter:description"
    content="This example allows the user to place a turbofan engine by tapping or clicking the ground.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="/spatial-extras.js" crossorigin="anonymous"></script>
  <script src="/spatial-landing.js" crossorigin="anonymous"></script>
  <script src="/spatial-engine.js" crossorigin="anonymous" async="true"
    data-preload-chunks="slam"></script>
</head>

<body>
  <script src="./app.bundle.js"></script>

  <div class="over">
    <span id="promptText">Tap To Place Turbine</span>
  </div>

  <div id="actionContainer" class="action-container" style="display: none; flex-direction: row; gap: 10px; justify-content: center; align-items: center;">
    <button id="btnExplode" class="action-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14l6-6 4 4 6-6"></path>
      </svg>
      <span id="explodeBtnText">Expand Engine</span>
    </button>
  </div>

  <!-- Container for screen-projected hotspots -->
  <div id="hotspotMarkersContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 26;"></div>

  <!-- SVG Overlay for connecting line -->


  <!-- Screen-projected details card -->
  <div id="detailsCard" class="details-card-projected" style="display: none;">
    <button id="closeDetailsBtn" class="close-details-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h4 id="detailsTitle" class="details-title">Part Title</h4>
    <p id="detailsDesc" class="details-desc">Part description...</p>
    
    <!-- Spin Toggle (Only shown for blades) -->
    <div id="spinToggleContainer" class="spin-toggle-container" style="display: none;">
      <span class="spin-label">TEST ROTATION</span>
      <label class="premium-switch">
        <input type="checkbox" id="spinToggleCheckbox">
        <span class="premium-slider"></span>
      </label>
    </div>
  </div>

  <!-- Sliders panel for manual offset adjustment -->
  <div id="controlsPanel" class="controls-panel" style="display: none;">
    <h3 class="panel-title">Offset Adjuster</h3>
    
    <div class="control-group">
      <label>1. Front Shroud (<span id="val_front_shroud">-6.400</span>m)</label>
      <input type="range" id="slide_front_shroud" min="-10.0" max="10.0" step="0.05" value="-6.400">
    </div>
    
    <div class="control-group">
      <label>2. Fan Blades (<span id="val_blades">-3.700</span>m)</label>
      <input type="range" id="slide_blades" min="-10.0" max="10.0" step="0.05" value="-3.700">
    </div>
    
    <div class="control-group">
      <label>3. Outer Casing (<span id="val_hull">0.000</span>m)</label>
      <input type="range" id="slide_hull" min="-10.0" max="10.0" step="0.05" value="0.000">
    </div>
    
    <div class="control-group">
      <label>4. Middle Casing (<span id="val_hull_middle">5.450</span>m)</label>
      <input type="range" id="slide_hull_middle" min="-10.0" max="10.0" step="0.05" value="5.450">
    </div>
    
    <div class="control-group">
      <label>5. Electronics Side (<span id="val_electronics">0.000</span>m)</label>
      <input type="range" id="slide_electronics" min="-10.0" max="10.0" step="0.05" value="0.000">
    </div>
    
    <div class="control-group">
      <label>6. Exhaust Flaps (<span id="val_flaps">2.800</span>m)</label>
      <input type="range" id="slide_flaps" min="-10.0" max="10.0" step="0.05" value="2.800">
    </div>
    
    <div class="control-group">
      <label>7. Exhaust Cone (<span id="val_plates_back">3.950</span>m)</label>
      <input type="range" id="slide_plates_back" min="-10.0" max="10.0" step="0.05" value="3.950">
    </div>
    
    <div class="control-group">
      <label>8. Fins Outside (<span id="val_fins_outside">6.150</span>m)</label>
      <input type="range" id="slide_fins_outside" min="-10.0" max="10.0" step="0.05" value="6.150">
    </div>
    
    <div class="control-group">
      <label>9. Containers (<span id="val_containers">-4.850</span>m)</label>
      <input type="range" id="slide_containers" min="-10.0" max="10.0" step="0.05" value="-4.850">
    </div>
  </div>

  <!-- Add the tap-place component to the scene so it has an effect -->
  <a-scene xrextras-gesture-detector tap-place landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="
    allowedDevices: any;
    defaultEnvironmentFogIntensity: 0.5; 
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;">

    <!-- We can define assets here to be loaded when A-Frame initializes -->
    <a-assets>
      <img id="groundTex" src="assets/sand.jpg">
      <a-asset-item id="engineModel" src="assets/turbine__turbofan_engine.glb"></a-asset-item>
    </a-assets>

    <!-- The raycaster will emit mouse events on scene objects specified with the cantap class -->
    <a-camera id="camera" position="0 8 8" raycaster="objects: .cantap" cursor="
      fuse: false;
      rayOrigin: mouse;">
      <a-entity light="type: directional; intensity: 0.15;" position="0 0 0"></a-entity>
    </a-camera>

    <a-entity light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight: 1024;
      shadowMapWidth: 1024;
      shadowCameraTop: 15;
      shadowCameraBottom: -15;
      shadowCameraRight: 15;
      shadowCameraLeft: -15;
      target: #camera" xrextras-attach="target: camera; offset: 8 15 4" position="1 4.3 2.5" shadow>
    </a-entity>

    <a-light type="ambient" intensity="0.28"></a-light>
    <a-light type="hemisphere" color="#ffffff" ground-color="#333333" intensity="0.22"></a-light>

    <!-- Adding the cantap class allows the ground to be clicked -->
    <a-box id="ground" class="cantap" scale="1000 2 1000" position="0 -0.99 0"
      material="shader: shadow; transparent: true; opacity: 0.4" shadow>
    </a-box>
  </a-scene>

</body>

</html>
