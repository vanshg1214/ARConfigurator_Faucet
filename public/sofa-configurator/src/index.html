<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sofa Configurator</title>
  
  <!-- 8thWall WebAR scripts -->
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="/spatial-extras.js" crossorigin="anonymous"></script>
  <script src="/spatial-landing.js" crossorigin="anonymous"></script>
  <script src="/spatial-engine.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>
</head>

<body>
  <script src="./app.bundle.js"></script>

  <div class="over">
    <span id="promptText">Tap To Place Sofa (Cactus for now)</span>
  </div>

  <a-scene xrextras-gesture-detector tap-place landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="
    allowedDevices: any;
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;">

    <a-assets>
      <img id="groundTex" src="assets/sand.jpg">
      <a-asset-item id="sofaModel" src="assets/chesterfield-sofa.glb"></a-asset-item>
    </a-assets>

    <a-camera id="camera" position="0 8 8" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-entity light="type: directional; intensity: 0.8; castShadow: true; shadowMapHeight:2048; shadowMapWidth:2048; shadowCameraTop: 40; shadowCameraBottom: -40; shadowCameraRight: 40; shadowCameraLeft: -40; target: #camera" xrextras-attach="target: camera; offset: 8 15 4" position="1 4.3 2.5" shadow></a-entity>

    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="hemisphere" color="#ffffff" ground-color="#8c8c8c" intensity="0.6"></a-light>

    <a-box id="ground" class="cantap" scale="1000 2 1000" position="0 -0.99 0" material="shader: shadow; transparent: true; opacity: 0.4" shadow></a-box>
  </a-scene>

</body>
</html>
