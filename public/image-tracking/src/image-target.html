<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Frame: Custom Image Target</title>

  <!-- spatial scripts -->
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="/spatial-extras.js" crossorigin="anonymous"></script>
  <script src="/spatial-landing.js" crossorigin="anonymous"></script>
  <script src="/spatial-engine.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>
</head>

<body>
  <!-- Bundle generated by Webpack for this route -->
  <script src="./app.bundle.js"></script>

  <!-- We use standard xrweb but omit the imageTargets param because we injected it via XR8.XrController.configure in our JS -->
  <a-scene xrextras-gesture-detector xrextras-runtime-error renderer="colorManagement:true" xrweb="allowedDevices: any;">

    <a-camera id="camera" position="0 8 8" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <!-- Invisible ground plane for xrextras-hold-drag to raycast against -->
    <a-plane id="ground" class="cantap" position="0 0 0" rotation="-90 0 0" width="100" height="100" material="transparent: true; opacity: 0"></a-plane>

    <a-assets>
      <a-asset-item id="watchModel" src="assets/apple_watch_ultra_2.glb"></a-asset-item>
    </a-assets>

    <!-- Use our custom component for Extended Tracking (SLAM) -->
    <a-entity persisting-image-target="name: watch-img">
      <!-- Spawn the watch model right on top of the image target -->
      <a-entity 
        gltf-model="#watchModel" 
        scale="15 15 15" 
        position="0.72 0 0" 
        rotation="18 -37 -5"
        xrextras-hold-drag 
        xrextras-two-finger-rotate 
        xrextras-pinch-scale
        transform-logger>
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
